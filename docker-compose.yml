services:

  macro:
    build: 
      context: .
      dockerfile: Dockerfile

    environment:
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}

    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped



  redis:
    image: redis:8.4
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: arq src.worker.WorkerSettings
    environment:
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      
    # env_file:
    #   - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped


    # ── Caddy: Reverse proxy + Load balancer ─────────────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - macro
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  redis_data: