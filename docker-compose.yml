services:

  macro:
    build: 
      context: .
      dockerfile: Dockerfile

    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
     
    container_name: macro
    ports:
      - "8000:8000"
      
    environment:
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}

    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    restart: unless-stopped



  redis:
    image: redis:8.4
    command: redis-server --save 60 1 --loglevel warning
    container_name: redis
    expose:
      - 6379:6379
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: arq src.worker.WorkerSettings
    container_name: worker
    environment:
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      

    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped


    # ── Caddy: Reverse proxy + Load balancer ─────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - macro
    networks:
      - internal
    restart: unless-stopped


  nats:
    image: nats
    ports:
      - "8222:8222"
    command: "--cluster_name NATS --cluster nats://0.0.0.0:6222 --http_port 8222 "

    networks:
      - internal





networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  redis_data: